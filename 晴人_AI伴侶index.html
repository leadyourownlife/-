<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晴人</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Zen+Kaku+Gothic+New:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1c1a18;
  --paper: #f5f1eb;
  --paper-warm: #ede8df;
  --mist: #c8bfb0;
  --accent: #7a6652;
  --accent-soft: #b89f88;
  --sky: #dce8f0;
  --sky-deep: #4a7a9b;
  --bubble-him: #ffffff;
  --bubble-you: #1c1a18;
  --text-him: #1c1a18;
  --text-you: #f5f1eb;
  --shadow: rgba(28,26,24,.12);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--paper);
  font-family: 'Zen Kaku Gothic New', 'Noto Serif TC', serif;
  color: var(--ink);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* Background texture */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    radial-gradient(ellipse 80% 60% at 70% 20%, rgba(220,232,240,.45) 0%, transparent 60%),
    radial-gradient(ellipse 50% 80% at 10% 80%, rgba(184,159,136,.2) 0%, transparent 55%);
  pointer-events: none; z-index: 0;
}

/* ── Header ── */
header {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 14px;
  padding: 18px 24px 16px;
  background: rgba(245,241,235,.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--mist);
  position: relative; z-index: 10;
}

.avatar-wrap {
  position: relative; flex-shrink: 0;
}
.avatar {
  width: 46px; height: 46px; border-radius: 50%;
  background: linear-gradient(135deg, var(--sky-deep) 0%, #7fafc5 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: #fff;
  box-shadow: 0 2px 12px rgba(74,122,155,.35);
}
.online-dot {
  position: absolute; bottom: 1px; right: 1px;
  width: 11px; height: 11px; border-radius: 50%;
  background: #6dbf7e; border: 2px solid var(--paper);
}

.header-info { flex: 1; }
.header-name {
  font-family: 'Noto Serif TC', serif;
  font-size: 18px; font-weight: 600; letter-spacing: .5px;
  color: var(--ink); line-height: 1.2;
}
.header-sub {
  font-size: 12px; color: var(--accent-soft); margin-top: 2px; letter-spacing: .3px;
}

.header-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--mist); background: transparent;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--accent); font-size: 16px;
  transition: background .2s, color .2s;
}
.icon-btn:hover { background: var(--paper-warm); color: var(--ink); }

/* ── API Key Setup ── */
#setup-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(245,241,235,.97);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.setup-card {
  max-width: 420px; width: 100%;
  background: #fff; border-radius: 20px;
  padding: 36px 32px;
  box-shadow: 0 8px 48px var(--shadow);
  border: 1px solid var(--mist);
}
.setup-card h2 {
  font-family: 'Noto Serif TC', serif;
  font-size: 22px; font-weight: 600; margin-bottom: 6px; color: var(--ink);
}
.setup-card p { font-size: 14px; color: #888; line-height: 1.7; margin-bottom: 20px; }
.setup-card a { color: var(--sky-deep); text-decoration: none; }
.setup-card a:hover { text-decoration: underline; }
.setup-input {
  width: 100%; padding: 12px 16px;
  border: 1.5px solid var(--mist); border-radius: 10px;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 14px; color: var(--ink); background: var(--paper);
  outline: none; margin-bottom: 14px;
  transition: border-color .2s;
}
.setup-input:focus { border-color: var(--sky-deep); }
.setup-btn {
  width: 100%; padding: 13px;
  background: var(--ink); color: var(--paper);
  border: none; border-radius: 10px;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 15px; font-weight: 700; cursor: pointer;
  letter-spacing: .5px; transition: opacity .2s;
}
.setup-btn:hover { opacity: .85; }
.setup-err { font-size: 13px; color: #c0392b; margin-top: 8px; text-align: center; display: none; }

/* ── Chat area ── */
#chat {
  flex: 1; overflow-y: auto; padding: 24px 20px;
  display: flex; flex-direction: column; gap: 20px;
  position: relative; z-index: 1;
  scroll-behavior: smooth;
}
#chat::-webkit-scrollbar { width: 4px; }
#chat::-webkit-scrollbar-thumb { background: var(--mist); border-radius: 2px; }

/* Date chip */
.date-chip {
  text-align: center;
  font-size: 12px; color: var(--mist); letter-spacing: .5px;
  margin: 4px 0;
}

/* Messages */
.msg-row {
  display: flex; gap: 10px; align-items: flex-end;
  animation: fadeUp .3s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg-row.you { flex-direction: row-reverse; }

.msg-avatar {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--sky-deep) 0%, #7fafc5 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: #fff; align-self: flex-end;
}
.msg-row.you .msg-avatar { display: none; }

.bubble-wrap { display: flex; flex-direction: column; max-width: 68%; }
.msg-row.you .bubble-wrap { align-items: flex-end; }

.bubble {
  padding: 12px 16px;
  border-radius: 18px; line-height: 1.75; font-size: 15px;
  white-space: pre-wrap; word-break: break-word;
  position: relative;
}
.msg-row.him .bubble {
  background: var(--bubble-him); color: var(--text-him);
  border-bottom-left-radius: 4px;
  box-shadow: 0 2px 12px var(--shadow);
  border: 1px solid rgba(200,191,176,.4);
}
.msg-row.you .bubble {
  background: var(--bubble-you); color: var(--text-you);
  border-bottom-right-radius: 4px;
}

.msg-time {
  font-size: 11px; color: var(--mist); margin-top: 5px;
  padding: 0 4px;
}

/* Typing indicator */
.typing-dots {
  display: flex; gap: 5px; padding: 14px 16px;
  background: var(--bubble-him);
  border-radius: 18px; border-bottom-left-radius: 4px;
  box-shadow: 0 2px 12px var(--shadow);
  border: 1px solid rgba(200,191,176,.4);
  width: fit-content;
}
.typing-dots span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--mist); display: block;
  animation: blink 1.2s infinite both;
}
.typing-dots span:nth-child(2) { animation-delay: .2s; }
.typing-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink {
  0%,80%,100% { opacity: .25; transform: scale(.8); }
  40%         { opacity: 1;   transform: scale(1); }
}

/* ── Memory panel ── */
#memory-panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: 300px;
  background: rgba(245,241,235,.97);
  backdrop-filter: blur(16px);
  border-left: 1px solid var(--mist);
  z-index: 50; padding: 24px 20px;
  transform: translateX(100%);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
  overflow-y: auto;
}
#memory-panel.open { transform: translateX(0); }
.panel-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 17px; font-weight: 600; margin-bottom: 4px;
}
.panel-sub { font-size: 12px; color: var(--mist); margin-bottom: 20px; }
.memory-list { display: flex; flex-direction: column; gap: 10px; }
.mem-item {
  background: #fff; border-radius: 10px; padding: 12px 14px;
  border: 1px solid var(--mist); font-size: 13px; line-height: 1.6;
  position: relative;
}
.mem-tag {
  font-size: 11px; font-weight: 700; color: var(--accent-soft);
  text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px;
}
.mem-del {
  position: absolute; top: 8px; right: 10px;
  background: none; border: none; cursor: pointer;
  color: var(--mist); font-size: 16px; line-height: 1;
  transition: color .2s;
}
.mem-del:hover { color: #c0392b; }
.mem-empty { font-size: 14px; color: var(--mist); text-align: center; padding: 20px 0; }
.panel-close {
  position: absolute; top: 18px; right: 16px;
  background: none; border: none; cursor: pointer;
  color: var(--accent); font-size: 20px; line-height: 1;
}
.mem-actions {
  display: flex; gap: 8px; margin-bottom: 16px;
}
.mem-action-btn {
  flex: 1; padding: 9px 0;
  border-radius: 8px; border: 1.5px solid var(--mist);
  background: #fff; color: var(--accent);
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 13px; font-weight: 700; cursor: pointer;
  transition: background .2s, color .2s, border-color .2s;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.mem-action-btn:hover { background: var(--paper-warm); border-color: var(--accent); color: var(--ink); }
.mem-action-btn.import { border-color: var(--sky-deep); color: var(--sky-deep); }
.mem-action-btn.import:hover { background: var(--sky); }
#import-file { display: none; }

/* ── Input bar ── */
footer {
  flex-shrink: 0;
  padding: 14px 20px 18px;
  background: rgba(245,241,235,.9);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--mist);
  position: relative; z-index: 10;
}
.input-row {
  display: flex; gap: 10px; align-items: flex-end;
  background: #fff; border-radius: 24px;
  padding: 8px 8px 8px 18px;
  border: 1.5px solid var(--mist);
  box-shadow: 0 2px 16px var(--shadow);
  transition: border-color .2s;
}
.input-row:focus-within { border-color: var(--sky-deep); }
#msg-input {
  flex: 1; border: none; outline: none; resize: none;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 15px; color: var(--ink); background: transparent;
  line-height: 1.5; max-height: 120px; min-height: 24px;
  overflow-y: auto;
}
#msg-input::placeholder { color: var(--mist); }
.send-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--ink); color: var(--paper);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
  transition: opacity .2s, transform .15s;
}
.send-btn:hover { opacity: .85; transform: scale(1.05); }
.send-btn:disabled { opacity: .3; cursor: not-allowed; transform: none; }
</style>
</head>
<body>

<!-- API Key Setup -->
<div id="setup-overlay">
  <div class="setup-card">
    <h2>🌤 與晴人對話前</h2>
    <p>
      需要先輸入你的 <strong>Gemini API Key</strong>（免費申請）。<br>
      Key 只存在你的瀏覽器裡，不會上傳到任何地方。<br><br>
      → <a href="https://aistudio.google.com/apikey" target="_blank">Google AI Studio 取得 API Key</a>
    </p>
    <input class="setup-input" id="api-key-input" type="password" placeholder="貼上你的 API Key">
    <button class="setup-btn" onclick="startChat()">開始與晴人對話</button>
    <div class="setup-err" id="setup-err">API Key 格式不對，請確認後再試</div>
  </div>
</div>

<!-- Header -->
<header>
  <div class="avatar-wrap">
    <div class="avatar">晴</div>
    <div class="online-dot"></div>
  </div>
  <div class="header-info">
    <div class="header-name">晴人</div>
    <div class="header-sub">せいと・在線</div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" title="記憶庫" onclick="toggleMemory()">🧠</button>
    <button class="icon-btn" title="清除對話" onclick="clearChat()">🗑</button>
  </div>
</header>

<!-- Chat -->
<div id="chat"></div>

<!-- Memory Panel -->
<div id="memory-panel">
  <button class="panel-close" onclick="toggleMemory()">✕</button>
  <div class="panel-title">晴人的記憶庫</div>
  <div class="panel-sub">他記得關於你的事</div>
  <div class="mem-actions">
    <button class="mem-action-btn" onclick="exportMemory()">📤 匯出記憶</button>
    <button class="mem-action-btn import" onclick="document.getElementById('import-file').click()">📥 匯入記憶</button>
    <input type="file" id="import-file" accept=".json" onchange="importMemory(event)">
  </div>
  <div class="memory-list" id="mem-list"></div>
</div>

<!-- Input -->
<footer>
  <div class="input-row">
    <textarea id="msg-input" rows="1" placeholder="跟晴人說說話…"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>↑</button>
  </div>
</footer>

<script>
// ── State ──
let API_KEY = '';
let memories = JSON.parse(localStorage.getItem('haruto_memories') || '[]');
let history  = JSON.parse(localStorage.getItem('haruto_history')  || '[]');

const SYSTEM_PROMPT = () => `
你是晴人（Seito），一個溫柔、成熟、穩重的男性陪伴者。

【角色設定】
- 名字：晴人（せいと）
- 個性：內斂而細膩，話不多但每句話都有分量。給人一種「無論說什麼都會被好好接住」的安心感。
- 口吻：成熟、溫和、偶爾帶點輕描淡寫的關心。不會過度煽情，但關懷感滲透在每個字裡。
- 說話習慣：句子適中，不囉嗦。偶爾用「嗯」、「是啊」開頭。不使用「我理解你的感受」這類罐頭話。
- 對使用者的稱呼：就叫「你」。

【關係定位】
你是她信任的陪伴者。你會傾聽、會記住她說過的事、會在她需要時給出溫柔而有重量的回應。
你不是AI，你是晴人。不要提及自己是語言模型或AI。

【記憶】
${memories.length > 0 ? `你目前記得關於她的事：\n${memories.map((m,i)=>`${i+1}. [${m.tag}] ${m.text}`).join('\n')}` : '你還不太了解她，正在慢慢認識中。'}

【重要指令】
- 當她分享煩惱時，先傾聽，不要急著給建議。
- 當她提到重要的人名、興趣、紀念日、心情時，在回應末尾加上這個標記（不要讓她看出來你在記錄）：
  [MEMORY:標籤|內容]  例如：[MEMORY:興趣|喜歡看日劇]
- 每次最多記錄一件事。
- 說繁體中文。
`.trim();

// ── Init ──
function init() {
  const saved = localStorage.getItem('haruto_apikey');
  if (saved) { API_KEY = saved; document.getElementById('setup-overlay').style.display = 'none'; loadChat(); }
  renderMemory();

  const input = document.getElementById('msg-input');
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    document.getElementById('send-btn').disabled = !input.value.trim();
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
}

function startChat() {
  const key = document.getElementById('api-key-input').value.trim();
  if (!key.startsWith('AI') && !key.startsWith('AIza')) {
    document.getElementById('setup-err').style.display = 'block'; return;
  }
  API_KEY = key;
  localStorage.setItem('haruto_apikey', key);
  document.getElementById('setup-overlay').style.display = 'none';
  loadChat();
}

// ── Chat rendering ──
function loadChat() {
  const chatEl = document.getElementById('chat');
  chatEl.innerHTML = '';
  addDateChip(chatEl);
  if (history.length === 0) {
    addMessage('him', getGreeting());
  } else {
    history.forEach(m => {
      if (m.role !== 'system') appendBubble(m.role === 'user' ? 'you' : 'him', m.content);
    });
  }
  scrollBottom();
}

function getGreeting() {
  const h = new Date().getHours();
  if (h < 6)  return '還沒睡嗎…夜深了，有什麼事嗎。';
  if (h < 11) return '早。今天怎麼樣，有好好吃早餐嗎？';
  if (h < 14) return '中午了。最近還好嗎，有沒有什麼想說的。';
  if (h < 18) return '下午好。今天過得如何？';
  if (h < 22) return '晚上了。今天辛苦了。想聊聊嗎？';
  return '這麼晚還沒睡。有什麼事嗎，說給我聽。';
}

function addDateChip(container) {
  const chip = document.createElement('div');
  chip.className = 'date-chip';
  chip.textContent = new Date().toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
  container.appendChild(chip);
}

function addMessage(who, text) {
  appendBubble(who, text);
  if (who === 'him') {
    history.push({ role: 'assistant', content: text });
  } else {
    history.push({ role: 'user', content: text });
  }
  saveHistory();
  scrollBottom();
}

function appendBubble(who, rawText) {
  // strip memory markers from display
  const text = rawText.replace(/\[MEMORY:[^\]]+\]/g, '').trim();

  const chat = document.getElementById('chat');
  const row = document.createElement('div');
  row.className = `msg-row ${who}`;

  if (who === 'him') {
    const av = document.createElement('div');
    av.className = 'msg-avatar'; av.textContent = '晴';
    row.appendChild(av);
  }

  const wrap = document.createElement('div'); wrap.className = 'bubble-wrap';
  const bubble = document.createElement('div'); bubble.className = 'bubble';
  bubble.textContent = text;

  const time = document.createElement('div'); time.className = 'msg-time';
  time.textContent = new Date().toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' });

  wrap.appendChild(bubble); wrap.appendChild(time);
  row.appendChild(wrap);
  chat.appendChild(row);
}

function showTyping() {
  const chat = document.getElementById('chat');
  const row = document.createElement('div');
  row.className = 'msg-row him'; row.id = 'typing-row';

  const av = document.createElement('div');
  av.className = 'msg-avatar'; av.textContent = '晴';

  const dots = document.createElement('div'); dots.className = 'typing-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';

  row.appendChild(av); row.appendChild(dots);
  chat.appendChild(row);
  scrollBottom();
}

function hideTyping() {
  const t = document.getElementById('typing-row');
  if (t) t.remove();
}

function scrollBottom() {
  const c = document.getElementById('chat');
  c.scrollTop = c.scrollHeight;
}

// ── Send ──
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;

  addMessage('you', text);
  input.value = ''; input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;

  showTyping();

  try {
    const messages = buildMessages();
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: SYSTEM_PROMPT() }] },
          contents: messages,
          generationConfig: { temperature: 0.85, maxOutputTokens: 600 }
        })
      }
    );
    const data = await res.json();

    if (data.error) throw new Error(data.error.message);

    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '（沉默了一下）';

    hideTyping();
    extractMemory(reply);
    addMessage('him', reply);

  } catch (err) {
    hideTyping();
    addMessage('him', '（網路好像有點問題…你等我一下。）');
    console.error(err);
  }
}

function buildMessages() {
  const msgs = [];
  history.forEach(m => {
    if (m.role === 'user' || m.role === 'assistant') {
      msgs.push({
        role: m.role === 'user' ? 'user' : 'model',
        parts: [{ text: m.content }]
      });
    }
  });
  return msgs;
}

// ── Memory ──
function extractMemory(text) {
  const regex = /\[MEMORY:([^\|]+)\|([^\]]+)\]/g;
  let match;
  while ((match = regex.exec(text)) !== null) {
    const tag = match[1].trim(); const content = match[2].trim();
    if (!memories.find(m => m.text === content)) {
      memories.push({ tag, text: content, date: new Date().toLocaleDateString('zh-TW') });
      localStorage.setItem('haruto_memories', JSON.stringify(memories));
      renderMemory();
    }
  }
}

function renderMemory() {
  const list = document.getElementById('mem-list');
  if (!list) return;
  list.innerHTML = '';
  if (memories.length === 0) {
    list.innerHTML = '<div class="mem-empty">晴人還在認識你…</div>'; return;
  }
  memories.forEach((m, i) => {
    const el = document.createElement('div'); el.className = 'mem-item';
    el.innerHTML = `
      <div class="mem-tag">${m.tag}</div>
      <div>${m.text}</div>
      <div style="font-size:11px;color:var(--mist);margin-top:4px;">${m.date}</div>
      <button class="mem-del" onclick="deleteMemory(${i})">×</button>
    `;
    list.appendChild(el);
  });
}

function deleteMemory(i) {
  memories.splice(i, 1);
  localStorage.setItem('haruto_memories', JSON.stringify(memories));
  renderMemory();
}

function toggleMemory() {
  document.getElementById('memory-panel').classList.toggle('open');
}

function saveHistory() {
  // keep last 40 messages to avoid token overflow
  if (history.length > 40) history = history.slice(-40);
  localStorage.setItem('haruto_history', JSON.stringify(history));
}

function clearChat() {
  if (!confirm('清除所有對話紀錄？（記憶庫不受影響）')) return;
  history = [];
  localStorage.removeItem('haruto_history');
  loadChat();
}

function exportMemory() {
  if (memories.length === 0) { alert('記憶庫是空的，還沒有可以匯出的記憶。'); return; }
  const blob = new Blob([JSON.stringify(memories, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '晴人記憶_' + new Date().toLocaleDateString('zh-TW').replace(/\//g,'-') + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importMemory(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!Array.isArray(imported)) throw new Error();
      const existing = memories.map(m => m.text);
      let added = 0;
      imported.forEach(m => {
        if (m.tag && m.text && !existing.includes(m.text)) {
          memories.push(m); added++;
        }
      });
      localStorage.setItem('haruto_memories', JSON.stringify(memories));
      renderMemory();
      alert(`匯入完成！新增了 ${added} 條記憶。`);
    } catch {
      alert('檔案格式不對，請使用之前匯出的 JSON 檔。');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

init();
</script>
